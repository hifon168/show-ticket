# ============================================================
# Nginx 站点配置（TLS 终止 + 反向代理）
# 部署位置：/etc/nginx/sites-available/show-ticket
# 然后软链：ln -s /etc/nginx/sites-available/show-ticket /etc/nginx/sites-enabled/
# 并删除默认站点：rm /etc/nginx/sites-enabled/default
# ============================================================

# HTTP 80：强制跳转 HTTPS + 放行 ACME 校验（申请证书用）
server {
    listen 80;
    server_name 你的域名.com www.你的域名.com;

    # Let's Encrypt 证书申请时放开，平时可保留
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 443：反代到 Node（PORT=3001）
server {
    listen 443 ssl http2;
    server_name 你的域名.com www.你的域名.com;

    # 证书路径（云厂商免费证书或 Let's Encrypt 申请后填入）
    ssl_certificate     /etc/nginx/ssl/你的域名.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/你的域名.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 上传大小限制（海报等）
    client_max_body_size 10m;

    # 反向代理所有请求到 Express（含前端静态与 /api）
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
